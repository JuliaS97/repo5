<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Bug Not Found</title>
  <style>
    body {
      font-family: monospace;
      background-color: #1e1e1e;
      color: #00ff7f;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 80px;
      margin-bottom: 0;
    }
    p {
      font-size: 20px;
      color: #cccccc;
    }
    .blink {
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Bug Not Found</h2>
  <p>QA tried everything... but this bug refuses to reproduce.</p>
  <p class="blink">_ Status: Cannot reproduce on staging _</p>
  <p>Please try again on production. It always works there. 😏</p>
</body>
</html>
